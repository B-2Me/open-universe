<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Planck Field Engine</title>
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
    
    <div id="app">
        <!-- Main Viewport Area -->
        <div id="left-pane">
            
            <!-- The Bare-Metal Grid -->
            <div id="canvas-container">
                <div id="error-banner"></div>
                <canvas id="universe_canvas" width="400" height="400"></canvas>
            </div>

            <!-- The Control Deck (Immediately under canvas) -->
            <div id="control-deck">
                
                <!-- Interaction Row -->
                <div class="segment-control">
                    <button class="segment-btn active" data-mode="move">✋ Pan</button>
                    <button class="segment-btn" data-mode="place">🪄 Paste</button>
                    <button class="segment-btn" data-mode="sample">⛶ Copy</button>
                </div>

                <!-- NEW: Context: Visual Brush Palette -->
                <div id="context_place" class="context-panel" style="display: none;">
                    <div class="palette-grid" id="brush_selector">
                        <button class="palette-btn active" data-val="dot">
                            <span class="p-icon">■</span>
                            <span class="p-label">Node</span>
                        </button>
                        <button class="palette-btn" data-val="glider">
                            <span class="p-icon">◰</span>
                            <span class="p-label">Glider</span>
                        </button>
                        <button class="palette-btn" data-val="lwss">
                            <span class="p-icon">⤞</span>
                            <span class="p-label">LWSS</span>
                        </button>
                        <button class="palette-btn" data-val="custom" id="opt_custom">
                            <span class="p-icon">⬚</span>
                            <span class="p-label" id="scratch_label">Scratch</span>
                        </button>
                    </div>
                </div>

                <!-- Context: Sample Mode -->
                <div id="context_sample" class="context-panel" style="display: none;">
                    <label>Capture Radius: <span id="val_radius" style="color: var(--pf-brand-hover);">10</span> px</label>
                    <input type="range" id="slider_radius" min="1" max="50" value="10">
                    <button id="btn_copy_stamp" class="action-btn" style="margin-top: 10px; width: 100%;">Copy JSON</button>
                </div>

                <!-- Optics & Zoom Row -->
                <div class="deck-row" style="margin-top: 8px;">
                    <div class="button-group" id="layer_selector" style="flex: 1; margin: 0;">
                        <button class="group-btn active" data-val="0">Macro</button>
                        <button class="group-btn" data-val="1">Metabolic</button>
                    </div>
                    <div class="button-group" style="flex: 1; margin: 0;">
                        <button class="group-btn" id="btn_zoom_out">−</button>
                        <button class="group-btn" id="btn_zoom_reset">Zoom</button>
                        <button class="group-btn" id="btn_zoom_in">+</button>
                    </div>
                </div>

                <!-- Playback Row -->
                <div class="deck-row" style="margin-top: 8px;">
                    <button id="btn_play" class="action-btn">⏯ Play/Pause</button>
                    <button id="btn_step" class="action-btn">⏭ Step</button>
                    <button id="btn_soup" class="action-btn">🍲 Soup</button>
                    <button id="btn_clear" class="action-btn danger">❌ Clear</button>
                </div>
                
                <!-- iOS Cheat Sheet Legend -->
                <div class="legend-panel">
                    <div class="legend-item"><span>✋ Pan:</span> Drag to move camera</div>
                    <div class="legend-item"><span>🪄 Paste:</span> Tap to draw pattern</div>
                    <div class="legend-item"><span>⛶ Copy:</span> Drag to capture area</div>
                    <div class="legend-item"><span>Macro:</span> Physical nodes</div>
                    <div class="legend-item"><span>Metabolic:</span> Thermal exhaust view</div>
                </div>

            </div>
        </div>

        <!-- The Obscure Settings Sidebar -->
        <div id="sidebar">
            <div class="panel-section">
                <h3>Environment Biome</h3>
                <div class="button-group" id="biome_selector">
                    <button class="group-btn active" data-val="0">Vacuum</button>
                    <button class="group-btn" data-val="1">Furnace</button>
                    <button class="group-btn" data-val="2">Crust</button>
                </div>

                <div class="telemetry-row" style="margin-top: 16px;">
                    <span class="telemetry-label">Entropy Rate:</span>
                    <span class="telemetry-value" id="math_dissipation">15</span>
                </div>
                <div class="telemetry-row">
                    <span class="telemetry-label">c² Limit:</span>
                    <span class="telemetry-value" id="math_thermal_limit">1200</span>
                </div>
            </div>

            <div class="panel-section">
                <h3>Diagnostics</h3>
                <div class="telemetry-row">
                    <span class="telemetry-label">Status:</span>
                    <span class="telemetry-value" id="diag_status" style="color: #888;">Booting</span>
                </div>
                <div class="telemetry-row">
                    <span class="telemetry-label">Nodes:</span>
                    <span class="telemetry-value" id="diag_nodes">--</span>
                </div>
            </div>
        </div>
    </div>

    <script src="planck.js?v=11" onerror="document.getElementById('error-banner').style.display='block';"></script>
    <script src="app.js?v=11"></script>
</body>
</html>
