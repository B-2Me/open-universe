<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Planck Field Engine (Bridge Simulator)</title>
    <!-- Cache bust bumped to v=20 -->
    <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
    
    <div id="app">
        <div id="left-pane">
            
            <div style="padding: 12px 16px 0 16px;">
                <div class="button-group" id="scenario_selector" style="margin-bottom: 8px;">
                    <button class="group-btn active" data-val="vacuum">Vacuum</button>
                    <button class="group-btn" data-val="atmosphere">Atmosphere</button>
                    <button class="group-btn" data-val="nozzle">Engine Bell</button>
                    <button class="group-btn" data-val="ocean">Ocean</button>
                </div>
                
                <div class="deck-row" style="margin-bottom: -4px;">
                    <button id="btn_toggle_left" class="action-btn" style="border-radius: 8px 0 0 0; background: var(--pf-bg-input); border-right: none; font-size: 11px;">👁 Macro</button>
                    <button id="btn_toggle_right" class="action-btn" style="border-radius: 0 8px 0 0; background: var(--pf-bg-input); font-size: 11px;">🕳 Entropic</button>
                </div>
            </div>

            <div id="canvas-container">
                <div id="error-banner"></div>
                <div id="transform-wrapper">
                    <div class="split-half">
                        <canvas id="canvas_left" width="400" height="400"></canvas>
                    </div>
                    <div class="split-half" style="border-left: 1px dashed rgba(255,255,255,0.15);">
                        <canvas id="canvas_right" width="400" height="400"></canvas>
                    </div>
                </div>
            </div>

            <div id="control-deck">
                
                <div style="position: relative; width: 100%;">
                    <!-- Dynamic Palette Popup -->
                    <div id="context_place" class="floating-popup">
                        <div class="palette-grid" id="brush_selector"></div>
                        
                        <!-- Injection Mode & Impedance Toggles -->
                        <div class="button-group" id="injection_mode_selector" style="margin-top: 12px; margin-bottom: 8px;">
                            <button class="group-btn active" data-val="clone" style="font-size: 11px;">🧱 Clone</button>
                            <button class="group-btn" data-val="quanta" style="font-size: 11px;">🟢 Mass</button>
                            <button class="group-btn" data-val="heat" style="font-size: 11px;">♨️ Heat</button>
                            <button class="group-btn" data-val="spin" style="font-size: 11px;">🧲 Spin</button>
                        </div>
                        
                        <div class="button-group" id="impedance_mode_selector" style="margin-bottom: 8px;">
                            <button class="group-btn active" data-val="1" style="font-size: 11px;">🌊 Refractive (Impedance)</button>
                            <button class="group-btn" data-val="0" style="font-size: 11px;">⚡ Raw Override</button>
                        </div>
                        
                        <!-- Palette Manager Actions -->
                        <div class="palette-actions" style="display: flex; gap: 4px; border-top: 1px solid var(--pf-brand-soft); padding-top: 8px;">
                            <button id="btn_save_scratch" class="action-btn primary" style="flex: 2; font-size: 11px; min-height: 32px;" disabled>💾 Save Scratch</button>
                            <button id="btn_export_palette" class="action-btn" style="flex: 1; font-size: 11px; min-height: 32px; padding: 0;">Export</button>
                            <label for="import_palette_input" class="action-btn" style="flex: 1; font-size: 11px; min-height: 32px; padding: 0; text-align: center; line-height: 32px; margin: 0; cursor: pointer;">Import</label>
                            <input type="file" id="import_palette_input" accept=".json" style="display: none;">
                            <button id="btn_reset_palette" class="action-btn danger" style="flex: 1; font-size: 11px; min-height: 32px; padding: 0;">❌</button>
                        </div>
                    </div>
                    
                    <!-- Capture Settings -->
                    <div id="context_sample" class="floating-popup">
                        <label style="font-size: 12px; display: block; text-align: center; margin-bottom: 8px;">Capture Radius: <span id="val_radius" style="color: var(--pf-brand-hover);">10</span>px</label>
                        <input type="range" id="slider_radius" min="1" max="50" value="10">
                        <button id="btn_copy_stamp" class="action-btn" style="width: 100%; margin-top: 8px;">📋 Copy JSON Array</button>
                    </div>
                </div>

                <div class="segment-control" style="margin-top: 12px;">
                    <button class="segment-btn active" data-mode="move">✋ Pan</button>
                    <button class="segment-btn" data-mode="place">🪄 Inject</button>
                    <button class="segment-btn" data-mode="sample">⛶ Capture</button>
                </div>

                <div class="deck-row" style="margin-top: 8px;">
                    <button id="btn_reset" class="action-btn primary" style="flex: 1;">⟳ Reset</button>
                    <button id="btn_soup" class="action-btn" style="flex: 1;">🎲 Soup</button>
                    <button id="btn_undo" class="action-btn" style="flex: 1;" title="Undo (Ctrl+Z)">↩ Undo</button>
                    <button id="btn_clear" class="action-btn danger" style="flex: 1;">❌ Clear</button>
                </div>

                <!-- NEW: Precision Slider Controls -->
                <div class="deck-row" style="margin-top: 12px; background: var(--pf-bg-input); border: 1px solid var(--pf-brand-soft); border-radius: 8px; padding: 8px;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; padding-right: 8px; border-right: 1px solid var(--pf-brand-soft);">
                        <label style="font-size: 11px; color: var(--pf-text-muted); text-align: center; font-weight: bold;">Speed: <span id="val_speed" style="color: var(--pf-text);">60 TPS</span></label>
                        <input type="range" id="slider_speed" min="0" max="120" value="60" style="min-height: 30px;">
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; padding-left: 8px;">
                        <label style="font-size: 11px; color: var(--pf-text-muted); text-align: center; font-weight: bold;">Zoom: <span id="val_zoom" style="color: var(--pf-text);">1.0x</span></label>
                        <input type="range" id="slider_zoom" min="1" max="10" step="0.1" value="1" style="min-height: 30px;">
                    </div>
                </div>
                
                <div class="deck-row" style="margin-top: 8px; gap: 6px;">
                    <button id="btn_export_vtk" class="action-btn" style="flex: 1; font-size: 11px; border-color: var(--pf-brand-soft);">📥 VTK</button>
                    <button id="btn_export_png" class="action-btn" style="flex: 1; font-size: 11px; border-color: var(--pf-brand-soft);">📷 PNG</button>
                    <button id="btn_share" class="action-btn" style="flex: 1; font-size: 11px; border-color: var(--pf-brand-soft);">📤 Share</button>
                </div>

            </div>
        </div>

        <div id="sidebar">
            <div class="panel-section">
                <h3>Telemetry</h3>
                <div class="telemetry-row">
                    <span class="telemetry-label">Status:</span>
                    <span class="telemetry-value" id="diag_status" style="color: #888;">Booting</span>
                </div>
                <div class="telemetry-row">
                    <span class="telemetry-label">Grid Nodes:</span>
                    <span class="telemetry-value" id="diag_nodes">--</span>
                </div>
                <div class="telemetry-row" style="margin-top: 12px; border-top: 1px solid var(--pf-brand-soft); padding-top: 8px;">
                    <span class="telemetry-label">Total Mass (Q):</span>
                    <span class="telemetry-value" id="diag_quanta">0</span>
                </div>
                <div class="telemetry-row">
                    <span class="telemetry-label">System Heat (E):</span>
                    <span class="telemetry-value" id="diag_heat">0</span>
                </div>
                <div class="telemetry-row">
                    <span class="telemetry-label">Phase Alignment:</span>
                    <span class="telemetry-value" id="diag_phase">0.0%</span>
                </div>
                <div class="telemetry-row">
                    <span class="telemetry-label">Actualization Yield (Y_act):</span>
                    <span class="telemetry-value" id="diag_yield">0</span>
                </div>
            </div>
            
            <div class="panel-section" style="opacity: 0.9;">
                <h3>Active Constraints</h3>
                <div class="telemetry-row" style="flex-direction: column; gap: 4px; margin-bottom: 12px;">
                    <div style="display: flex; justify-content: space-between;">
                        <span class="telemetry-label">Dissipation Rate:</span>
                        <span class="telemetry-value" id="math_dissipation">15</span>
                    </div>
                    <input type="range" id="slider_dissipation" min="1" max="50" value="15">
                </div>
                <div class="telemetry-row" style="flex-direction: column; gap: 4px;">
                    <div style="display: flex; justify-content: space-between;">
                        <span class="telemetry-label">Thermal Saturation:</span>
                        <span class="telemetry-value" id="math_thermal_limit">1200</span>
                    </div>
                    <input type="range" id="slider_thermal" min="100" max="100000" step="100" value="1200">
                </div>
            </div>
        </div>
    </div>

    <script src="planck.js?v=20" onerror="document.getElementById('error-banner').style.display='block';"></script>
    <script src="app.js?v=21"></script>
</body>
</html>
