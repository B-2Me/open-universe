<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Planck Field Engine</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    
    <div id="app">
        <div id="canvas-container">
            <div id="error-banner"></div>
            <canvas id="universe_canvas" width="400" height="400"></canvas>
        </div>

        <div id="sidebar">
            
            <div class="panel-section">
                <h3>Intervention Mode</h3>
                
                <div class="segment-control">
                    <button class="segment-btn active" data-mode="move">✋ Pan</button>
                    <button class="segment-btn" data-mode="place">🪄 Paste</button>
                    <button class="segment-btn" data-mode="sample">⛶ Copy</button>
                </div>

                <div id="context_place" class="context-panel" style="display: none;">
                    <label>Brush Palette</label>
                    <div class="button-group" id="brush_selector">
                        <button class="group-btn active" data-val="dot">Node</button>
                        <button class="group-btn" data-val="glider">Glider</button>
                        <button class="group-btn" data-val="lwss">LWSS</button>
                        <button class="group-btn" data-val="custom" id="opt_custom" disabled>Custom</button>
                    </div>
                </div>

                <div id="context_sample" class="context-panel" style="display: none;">
                    <label>Capture Radius: <span id="val_radius" style="color: var(--pf-brand-hover);">10</span> px</label>
                    <input type="range" id="slider_radius" min="1" max="50" value="10">
                    <button id="btn_copy_stamp" style="font-size: 12px; padding: 6px; margin-top: 10px; margin-bottom: 0;">Copy JSON to Clipboard</button>
                </div>
            </div>

            <div class="panel-section">
                <h3>Environment</h3>
                
                <label>Thermodynamic Biome</label>
                <div class="button-group" id="biome_selector">
                    <button class="group-btn active" data-val="0">Vacuum</button>
                    <button class="group-btn" data-val="1">Furnace</button>
                    <button class="group-btn" data-val="2">Crust</button>
                </div>
                
                <label style="margin-top: 12px;">Optical Filter</label>
                <div class="button-group" id="layer_selector">
                    <button class="group-btn active" data-val="0">Macro</button>
                    <button class="group-btn" data-val="1">Metabolic</button>
                </div>

                <div class="telemetry-row" style="margin-top: 16px;">
                    <span class="telemetry-label">Entropy Rate:</span>
                    <span class="telemetry-value" id="math_dissipation">15</span>
                </div>
                <div class="telemetry-row">
                    <span class="telemetry-label">c² Limit:</span>
                    <span class="telemetry-value" id="math_thermal_limit">1200</span>
                </div>
            </div>

            <div class="panel-section">
                <h3>Camera / View</h3>
                <div class="button-group">
                    <button class="group-btn" id="btn_zoom_out">−</button>
                    <button class="group-btn" id="btn_zoom_reset">Reset Zoom</button>
                    <button class="group-btn" id="btn_zoom_in">+</button>
                </div>
            </div>

            <div class="panel-section">
                <h3>Simulation</h3>
                <button id="btn_play">Pause / Play</button>
                <button id="btn_step">Tick (Frame Advance)</button>
                <button id="btn_soup">Inject Thermal Soup</button>
                <button id="btn_clear" style="border-color: #666; color: #aaa; background: transparent;">Absolute Zero (Clear)</button>
            </div>

            <div class="panel-section">
                <h3>System Diagnostics</h3>
                <div class="telemetry-row">
                    <span class="telemetry-label">Wasm Status:</span>
                    <span class="telemetry-value" id="diag_status" style="color: #888;">Booting</span>
                </div>
                <div class="telemetry-row">
                    <span class="telemetry-label">Nodes:</span>
                    <span class="telemetry-value" id="diag_nodes">--</span>
                </div>
            </div>

        </div>
    </div>

    <script src="planck.js?v=6" onerror="document.getElementById('error-banner').style.display='block'; document.getElementById('error-banner').innerText='Failed to load planck.js binary.';"></script>
    <script src="app.js?v=6"></script>
</body>
</html>
