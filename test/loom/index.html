<!doctype html>
<html><head><meta charset="utf-8"><title>Loom test</title>
<style>
  body { margin:0; background:#05050d; }
  .loom-simulator { position:relative; height:100vh; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .loom-hud { position:absolute; top:8px; left:8px; max-width:calc(100% - 64px); padding:4px 10px; font:11px monospace; color:#7fe; background:rgba(8,10,20,.6); border:1px solid rgba(80,140,200,.25); border-radius:8px; pointer-events:none; word-break:break-all; z-index:3; }
  .loom-uitoggle { position:absolute; top:8px; right:8px; width:34px; height:34px; font:14px monospace; color:#9ef; background:rgba(8,10,20,.6); border:1px solid rgba(80,140,200,.25); border-radius:8px; z-index:3; }
  .loom-simulator.dock-hidden .loom-dock { display:none; }
  .loom-dock { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); max-width:calc(100% - 16px); padding:6px 10px; display:flex; flex-wrap:wrap; justify-content:center; gap:4px 12px; align-items:center; background:rgba(8,10,20,.72); border:1px solid rgba(80,140,200,.25); border-radius:12px; z-index:3; }
  .loom-transport { display:flex; gap:4px; }
  .loom-transport button, .loom-dock select { min-width:34px; min-height:34px; padding:0 9px; font:13px monospace; color:#9ef; background:#18223a; border:1px solid rgba(80,140,200,.35); border-radius:7px; }
  label { font:11px monospace; color:#9ef; display:flex; align-items:center; gap:5px; white-space:nowrap; }
  input[type=range] { width:70px; height:22px; accent-color:#7fe; }
  output { min-width:2ch; color:#7fe; }
</style></head><body>
<div id="host" class="loom-simulator">
  <canvas></canvas>
  <div class="loom-hud" data-hud>booting…</div>
  <button class="loom-uitoggle" data-uitoggle title="Toggle controls">⚙</button>
  <div class="loom-dock">
    <div class="loom-transport">
      <button data-play title="Play / pause">⏸</button>
      <button data-step title="Step">⏭</button>
      <button data-reset title="Reset">⟲</button>
      <button data-knot title="Knot">✹</button>
      <button data-spin class="on" title="Auto-rotate">⟳</button>
    </div>
    <select data-preset title="Camera preset">
      <option value="full">Full torus</option><option value="equator">Equator slab</option>
      <option value="bore">Core bore</option><option value="lattice">Lattice plane</option>
    </select>
    <label>Slice <input type="range" data-zcenter min="0" max="39" step="1" value="20"><output>20</output></label>
    <label>Width <input type="range" data-zthick min="1" max="40" step="1" value="40"><output>40</output></label>
    <label>Size <input type="range" data-size min="20" max="150" step="1" value="55"><output>55</output></label>
    <label>Q≥ <input type="range" data-qmin min="1" max="120" step="1" value="1"><output>1</output></label>
    <select data-colormode title="Color mode"><option value="1">spin class</option><option value="0">density</option></select>
  </div>
</div>
<script type="module">
  const hud = document.querySelector('[data-hud]');
  const fail = e => { hud.textContent = 'ERR ' + (e && e.message || e); console.error(e); };
  import('/docs/.vitepress/loom/main.js')
    .then(m => m.initLoomSimulator(document.getElementById('host'), {
      wasmUrl: '/docs/public/wasm/wake/planck3.js',
      stateUrl: '/docs/public/loom/hopfion.p3st',
    }))
    .catch(fail);
</script>
</body></html>
