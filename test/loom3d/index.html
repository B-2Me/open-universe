<!doctype html>
<html><head><meta charset="utf-8"><title>Loom3D test</title>
<style>
  body { margin:0; background:#05050d; }
  .loom-simulator { position:relative; height:100vh; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .loom-hud { position:absolute; top:0; left:0; right:0; padding:8px 12px; font:11px monospace; color:#7fe; background:rgba(5,5,13,.55); pointer-events:none; }
  .loom-presets { position:absolute; top:34px; left:10px; display:flex; gap:6px; }
  .loom-dock { position:absolute; bottom:0; left:0; right:0; padding:8px 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:rgba(5,5,13,.55); }
  button, select { min-width:44px; min-height:44px; font:13px monospace; color:#9ef; background:#14202f; border:1px solid #4a7fb0; border-radius:6px; }
  label { font:11px monospace; color:#9ef; display:flex; align-items:center; gap:6px; min-height:44px; }
  input[type=range] { width:90px; height:44px; }
  .loom-transport { display:flex; gap:8px; }
</style></head><body>
<div id="host" class="loom-simulator">
  <canvas></canvas>
  <div class="loom-hud" data-hud>booting…</div>
  <div class="loom-presets">
    <button data-preset="full">Full</button><button data-preset="equator">Equator Cut</button>
    <button data-preset="bore">Core Bore</button><button data-preset="lattice">Lattice Plane</button>
  </div>
  <div class="loom-dock">
    <div class="loom-transport">
      <button data-play>⏸</button><button data-step>⏭</button>
      <button data-reset>↺</button><button data-knot>💥</button><button data-spin class="on">🔁</button>
    </div>
    <label>Elev <input type="range" data-zcenter min="0" max="39" step="1" value="20"></label>
    <label>Slab <input type="range" data-zthick min="1" max="40" step="1" value="40"></label>
    <label>Q≥ <input type="range" data-qmin min="1" max="120" step="1" value="1"></label>
    <label>Size <input type="range" data-size min="20" max="150" step="1" value="55"></label>
    <select data-colormode><option value="1">spin</option><option value="0">density</option></select>
  </div>
</div>
<script type="module">
  import { initLoomSimulator } from '/docs/.vitepress/loom/main.js';
  initLoomSimulator(document.getElementById('host'), {
    wasmUrl: '/docs/public/wasm/wake/planck3.js',
    stateUrl: '/docs/public/loom/hopfion.p3st',
  }).catch(e => { document.querySelector('[data-hud]').textContent = 'ERR ' + e.message; console.error(e); });
</script>
</body></html>
