name: Deploy Open Universe to GitHub Pages

on:
  push:
    branches: [main]
    # Only rebuild the site when site inputs actually change — the Kokoro
    # audio step lands real GPU load on the shared 3060 box, so a
    # src/smatrix or script-only push must not trigger a TTS storm.
    paths:
      - 'docs/**'
      - 'src/planck.c'
      - 'src/planck3.c'
      - 'src/engine-sim.mjs'
      - 'src/build.sh'
      - 'script/kokoro-pipeline.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install NPM Dependencies
        run: npm install

      # Audio is generated per-deploy and shipped via dist — it is a
      # build artifact (gitignored like the wasm), never committed back.
      # Restore the previous run's artifacts so the pipeline's
      # content-hash skip can regenerate only changed pages — the TTS
      # endpoint lands real load on the shared GPU box.
      - name: Restore audio cache
        uses: actions/cache@v4
        with:
          path: docs/public/audio
          key: kokoro-audio-${{ hashFiles('docs/**/*.md') }}
          restore-keys: kokoro-audio-

      - name: Run Kokoro Audio Pipeline
        run: npm run generate-audio

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        continue-on-error: true
        with:
          version: latest
          actions-cache-folder: 'emsdk-cache'

      - name: Compile Planck Field Engine
        run: |
          mkdir -p docs/public/wasm/wake/ docs/public/wasm/loom/
          cd src
          chmod +x build.sh || true
          ./build.sh
          test -f ../docs/public/wasm/wake/planck.wasm
          test -f ../docs/public/wasm/wake/planck-hex.wasm
          test -f ../docs/public/wasm/loom/planck3.wasm
          test -f ../docs/public/wasm/ember/meso3i.wasm

      - name: Build VitePress Site
        run: npm run docs:build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
