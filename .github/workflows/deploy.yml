name: Deploy Open Universe to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: EMERGENCY RESTORE (Audio Folder)
        run: |
          git checkout c3b3402 -- docs/public/audio
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/audio
          git diff --staged --quiet || git commit -m "rescue: restored audio folder from previous commit"
          git push
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install NPM Dependencies
        run: npm install

      # KOKORO PIPELINE TEMPORARILY COMMENTED OUT DUE TO API OUTAGE
      # - name: Run Kokoro Audio Pipeline
      #   run: npm run generate-audio

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        continue-on-error: true
        with:
          version: latest
          actions-cache-folder: 'emsdk-cache'

      - name: Compile Planck Field Engine
        continue-on-error: true
        run: |
          mkdir -p docs/public/wasm/wake/
          cd src
          chmod +x build.sh || true
          ./build.sh || true

      - name: Build VitePress Site
        run: npm run docs:build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
