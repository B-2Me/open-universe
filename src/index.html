<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planck Field Engine</title>
    <style>
        body { background-color: #111; color: #eee; font-family: monospace; text-align: center; margin: 0; padding: 20px; }
        #canvas-container { position: relative; display: inline-block; }
        canvas { background-color: #000; border: 1px solid #333; image-rendering: pixelated; }
        
        /* The Error Banner */
        #error-banner {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(200, 0, 0, 0.9);
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>
<body>
    
    <div id="canvas-container">
        <div id="error-banner"></div>
        <canvas id="universe_canvas" width="400" height="400"></canvas>
    </div>

    <!-- Load the hardened JS bridge first -->
    <script src="app.js"></script>
    
    <!-- Load the Emscripten output last -->
    <script src="planck.js" onerror="triggerErrorState('Failed to load planck.js binary.')"></script>
</body>
</html>
